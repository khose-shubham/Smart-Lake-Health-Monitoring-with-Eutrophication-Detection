version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: aquasense-mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - aquasense-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquasense-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/lake_monitor
      - JWT_SECRET=lake-monitor-docker-secret-2024
      - JWT_EXPIRES_IN=7d
      - DEVICE_API_KEY=lake-monitor-api-key-2024
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - aquasense-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aquasense-frontend
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - backend
    networks:
      - aquasense-net

networks:
  aquasense-net:
    driver: bridge

volumes:
  mongo-data:
